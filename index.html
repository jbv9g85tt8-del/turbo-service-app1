<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Turbo Service</title>

<style>
:root {
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1d1d1f;
  --sub:#6e6e73;
  --accent:#0071e3;
}

body {
  margin:0;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

h1 { font-size:22px; margin:0; }

.filters {
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.filter {
  padding:6px 12px;
  border-radius:999px;
  background:#fff;
  font-size:13px;
  cursor:pointer;
}

.filter.active {
  background:var(--accent);
  color:#fff;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

.card {
  background:var(--card);
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}

.vehicle { font-weight:600; margin-bottom:4px; }
.client { color:var(--sub); font-size:14px; margin-bottom:8px; }
.footer {
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--sub);
}
</style>
</head>

<body>

<header>
  <h1>Заказы в работе</h1>
  <button>Новый заказ</button>
</header>

<div class="filters">
  <div class="filter active" data-status="">Все</div>
  <div class="filter" data-status="st_001">Принят</div>
  <div class="filter" data-status="st_002">В работе</div>
  <div class="filter" data-status="st_003">Ожидание</div>
  <div class="filter" data-status="st_004">Готов</div>
</div>

<div id="grid" class="grid"></div>

<script>
const API_URL = 'ВСТАВЬ_СЮДА_API_URL';

const filters = document.querySelectorAll('.filter');
filters.forEach(f => {
  f.addEventListener('click', () => {
    filters.forEach(x => x.classList.remove('active'));
    f.classList.add('active');
    loadOrders(f.dataset.status);
  });
});

loadOrders();

function loadOrders(status='') {
  const url = status ? `${API_URL}?status=${status}` : API_URL;

  fetch(url)
    .then(r => r.json())
    .then(j => render(j.data.slice(0,6)));
}

function render(orders) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  orders.forEach(o => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="vehicle">${o.vehicle}</div>
      <div class="client">${o.client_id}</div>
      <div class="footer">
        <div>${o.status_name}</div>
        <div>${formatDate(o.order_date)}</div>
      </div>`;
    grid.appendChild(c);
  });
}

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('ru-RU');
}
</script>

</body>
</html>
