 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Turbo Service</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    .primary-btn {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .filters {
      display: inline-flex;
      background: var(--card-bg);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .filter {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background .2s;
    }

    .filter.active {
      background: var(--accent);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 8px 24px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 4px 8px rgba(0,0,0,0.06),
        0 16px 32px rgba(0,0,0,0.08);
    }

    .vehicle {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .client {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status {
      font-weight: 500;
    }
  </style>
</head>

<body>

<header>
  <h1>Заказы в работе</h1>
  <button class="primary-btn">Новый заказ</button>
</header>

<div class="filters">
  <div class="filter active">Все</div>
  <div class="filter">Принят</div>
  <div class="filter">В работе</div>
  <div class="filter">Готов</div>
</div>

<div class="grid">

  <div class="card">
    <div class="vehicle">BMW X5 3.0d</div>
    <div class="client">Иван Иванов</div>
    <div class="footer">
      <div class="status">Принят</div>
      <div>12.01.2025</div>
    </div>
  </div>

  <div class="card">
    <div class="vehicle">Audi A6 2.0 TDI</div>
    <div class="client">ООО «АвтоПлюс»</div>
    <div class="footer">
      <div class="status">В работе</div>
      <div>10.01.2025</div>
    </div>
  </div>

  <div class="card">
    <div class="vehicle">VW Passat 1.9 TDI</div>
    <div class="client">Сергей Петров</div>
    <div class="footer">
      <div class="status">Готов</div>
      <div>08.01.2025</div>
    </div>
  </div>

</div>

</body>
</html>
