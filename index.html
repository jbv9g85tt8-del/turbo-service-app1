<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Turbo Service</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    .primary-btn {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 8px 24px rgba(0,0,0,0.06);
    }

    /* ===== MODAL ===== */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: slideUp .25s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Заказы в работе</h1>
  <button class="primary-btn" onclick="openModal()">Новый заказ</button>
</header>

<div class="grid">
  <div class="card">BMW X5 3.0d</div>
  <div class="card">Audi A6 2.0 TDI</div>
</div>

<!-- ===== MODAL ===== -->

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Новый заказ</h2>

    <div class="form-group">
      <label>Клиент</label>
      <input type="text" placeholder="ФИО или компания">
    </div>

    <div class="form-group">
      <label>Автомобиль</label>
      <input type="text" placeholder="Марка, модель, двигатель">
    </div>

    <div class="form-group">
      <label>Дата приёма</label>
      <input type="date">
    </div>

    <div class="modal-actions">
      <button class="secondary-btn" onclick="closeModal()">Отмена</button>
      <button class="primary-btn">Сохранить</button>
    </div>
  </div>
</div>

<script>
  function openModal() {
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }
</script>

</body>
</html>
