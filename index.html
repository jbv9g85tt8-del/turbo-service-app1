<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Turbo Service</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    .primary-btn {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 8px 24px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 4px 8px rgba(0,0,0,0.06),
        0 16px 32px rgba(0,0,0,0.08);
    }

    .vehicle {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .client {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status {
      font-weight: 500;
    }

    .empty {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>Заказы в работе</h1>
  <button class="primary-btn">Новый заказ</button>
</header>

<div id="ordersGrid" class="grid"></div>
<div id="emptyState" class="empty" style="display:none;">
  Активных заказов нет
</div>

<script>
  // ===== НАСТРОЙКА =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbz6rOJHvEVzYzAM8xVSnUlqhGzcrzbCY8HkI3rNWLvOyiFJQeOrmi6xsb5OfxvUA62kbQ/exec';

  // ===== ЗАГРУЗКА ДАННЫХ =====
  fetch(API_URL)
    .then(res => res.json())
    .then(json => {
      if (!json.success) throw new Error('API error');

      const orders = json.data
        .sort((a, b) => new Date(b.order_date) - new Date(a.order_date))
        .slice(0, 6);

      renderOrders(orders);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('emptyState').style.display = 'block';
    });

  // ===== ОТРИСОВКА =====
  function renderOrders(orders) {
    const grid = document.getElementById('ordersGrid');
    grid.innerHTML = '';

    if (orders.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }

    orders.forEach(order => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="vehicle">${escapeHtml(order.vehicle || '')}</div>
        <div class="client">${escapeHtml(order.client_id || '')}</div>
        <div class="footer">
          <div class="status">${escapeHtml(order.status_name || '')}</div>
          <div>${formatDate(order.order_date)}</div>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  // ===== УТИЛИТЫ =====
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}.${month}.${year}`;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[m]);
  }
</script>

</body>
</html>>
